# Build the 32-bit Windows ATB solver and verify it against the client's reference
# outputs on a real x86-64 runner.  Manual trigger only: Windows minutes bill at 2x
# against the org's free tier, so nothing runs on push.
#
#   GITHUB_TOKEN= gh workflow run windows-build.yml --repo bcn-services/bcns-client-technology-associates-atb
#   ... -f win64=true        # optionally also build/verify an x86_64 comparison binary (not shipped)
name: Windows build + verification
on:
  workflow_dispatch:
    inputs:
      win64:
        description: "Also build and verify an x86_64 comparison binary (not the deliverable)"
        type: boolean
        default: false

jobs:
  win32:
    name: 32-bit x86 (deliverable)
    # Pinned, not windows-latest, so the report can name the OS it ran on.
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash          # Git bash; the solver is a static native exe and needs no MSYS runtime
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW32 environment)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: file

      - name: Install MinGW-w64 (i686) gfortran
        shell: msys2 {0}
        run: |
          # MSYS2's current [mingw32] package database still carries gcc 16 but has dropped
          # gcc-fortran. The last i686 gfortran build (15.2.0) is still published on
          # repo.msys2.org, so install it by URL on top of the current toolchain deps.
          # If that ever disappears, fall back to the winlibs MinGW-w64 i686 gfortran zip.
          set -o pipefail
          if ! grep -q '^\[mingw32\]' /etc/pacman.conf; then
            printf '\n[mingw32]\nServer = https://mirror.msys2.org/mingw/mingw32/\nServer = https://repo.msys2.org/mingw/mingw32/\n' >> /etc/pacman.conf
          fi
          pacman -Sy --noconfirm
          V=15.2.0-14; U=https://repo.msys2.org/mingw/mingw32
          if pacman -S --noconfirm --needed mingw-w64-i686-binutils mingw-w64-i686-crt mingw-w64-i686-headers \
               mingw-w64-i686-winpthreads mingw-w64-i686-libwinpthread mingw-w64-i686-gmp mingw-w64-i686-isl \
               mingw-w64-i686-mpc mingw-w64-i686-mpfr mingw-w64-i686-zlib mingw-w64-i686-zstd \
               mingw-w64-i686-libiconv mingw-w64-i686-windows-default-manifest \
             && pacman -U --noconfirm $U/mingw-w64-i686-gcc-libs-$V-any.pkg.tar.zst $U/mingw-w64-i686-gcc-$V-any.pkg.tar.zst \
                  $U/mingw-w64-i686-gcc-libgfortran-$V-any.pkg.tar.zst $U/mingw-w64-i686-gcc-fortran-$V-any.pkg.tar.zst \
             && gfortran --version; then
            echo "toolchain: MSYS2 mingw-w64-i686-gcc-fortran $V (installed by URL from repo.msys2.org)" > toolchain.txt
          else
            echo "MSYS2 i686 gfortran install failed; falling back to winlibs"
            pacman -S --noconfirm --needed unzip
            url=$(curl -s https://api.github.com/repos/brechtsanders/winlibs_mingw/releases/latest \
                  | grep -o 'https://[^"]*winlibs-i686-posix-dwarf-gcc-[^"]*ucrt[^"]*\.zip' | head -1)
            echo "downloading $url"; curl -sL -o winlibs.zip "$url"
            dest=$(cygpath -u "$RUNNER_TEMP")/winlibs; mkdir -p "$dest"; unzip -q winlibs.zip -d "$dest"
            echo "$dest/mingw32/bin" > toolchain-path.txt
            PATH="$dest/mingw32/bin:$PATH" gfortran --version
            echo "toolchain: winlibs MinGW-w64 i686 ($(basename "$url"))" > toolchain.txt
          fi
          gfortran --version | head -1 >> toolchain.txt 2>/dev/null || true
          cat toolchain.txt

      - name: Build (-m32 -mfpmath=387 -static)
        shell: msys2 {0}
        working-directory: src
        run: |
          [ -f ../toolchain-path.txt ] && export PATH="$(cat ../toolchain-path.txt):$PATH"
          gfortran --version | head -1
          TARGET=win32 bash ../build.sh
          cp atb-win32.exe ..

      - name: Check the exe is 32-bit and statically linked
        shell: msys2 {0}
        run: |
          set -o pipefail
          [ -f toolchain-path.txt ] && export PATH="$(cat toolchain-path.txt):$PATH"
          { echo "## toolchain"; cat toolchain.txt; echo "## file"; file atb-win32.exe;
            echo "## PE header"; objdump -f atb-win32.exe | grep -E 'file format|architecture';
            echo "## imported DLLs"; objdump -p atb-win32.exe | grep -i 'DLL Name';
            echo "## gfortran"; gfortran --version | head -1; } | tee binary-check.txt
          objdump -f atb-win32.exe | grep -q 'file format pei-i386' || { echo "NOT a 32-bit PE (objdump)"; exit 1; }
          file atb-win32.exe | grep -qE 'PE32 executable.*(80386|i386)' || { echo "NOT a 32-bit PE (file)"; exit 1; }
          if objdump -p atb-win32.exe | grep -i 'DLL Name' | grep -iqE 'libgfortran|libgcc|libquadmath|libwinpthread|libstdc'; then
            echo "exe imports a MinGW runtime DLL -> not statically linked"; exit 1; fi
          echo "static-link check: OK (only Windows system DLLs imported)"

      - name: Runner info
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor
          "OS: $($os.Caption) $($os.Version) ($($os.OSArchitecture))" | Tee-Object runner-info.txt
          "CPU: $($cpu.Name)" | Tee-Object -Append runner-info.txt
          "Image: $env:ImageOS $env:ImageVersion" | Tee-Object -Append runner-info.txt

      - name: Run all cases
        run: |
          set -o pipefail
          WORK="$(cygpath -m "$RUNNER_TEMP")/w"   # short path (solver stores cwd in 80 chars); mixed form D:/a/_temp/w is valid for bash, the exe and Windows python
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          ATB="$PWD/atb-win32.exe" WORK="$WORK" bash verify/run_all.sh 2>&1 | tee run_all.txt

      - name: Compare against reference outputs
        run: |
          set -o pipefail; export WORK
          python verify/cmp.py  2>&1 | tee cmp.txt
          python verify/grow.py 2>&1 | tee grow.txt
          python verify/report.py --label "32-bit x86, x87 FPU (-m32 -mfpmath=387), static; $(head -1 runner-info.txt)" 2>&1 | tee table.md
          mkdir -p report/outputs && cp -R "$WORK"/. report/outputs/
          cp table.md cmp.txt grow.txt run_all.txt runner-info.txt binary-check.txt toolchain.txt report/
          cp "$WORK/report.json" report/ 2>/dev/null || true

      - name: Fail if any case did not run to completion
        run: |
          # normal solver exit is STOP 1; every run must also have produced its .t21
          bad=0
          while read key d base sub rc secs; do
            [ "$rc" = 0 ] || [ "$rc" = 1 ] || { echo "FAILED: $key exit $rc"; bad=1; }
            [ -s "$WORK/$sub/${base}_new.t21" ] || { echo "FAILED: $key produced no .t21"; bad=1; }
          done < "$WORK/cases.txt"
          n=$(grep -c . "$WORK/cases.txt"); [ "$n" -eq 12 ] || { echo "FAILED: expected 12 runs (11 case folders, 2638 is two steps), got $n"; bad=1; }
          exit $bad

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atb-win32-exe
          path: atb-win32.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report-win32
          path: report/

  win64:
    name: x86-64 (comparison only, not shipped)
    if: ${{ inputs.win64 }}
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-binutils file
      - name: Build (x86-64, SSE math, -static)
        shell: msys2 {0}
        working-directory: src
        run: |
          TARGET=win64 bash ../build.sh
          cp atb-win64.exe ..
          { file atb-win64.exe; objdump -p atb-win64.exe | grep -i 'DLL Name'; } | tee ../binary-check.txt
      - name: Runner info
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "OS: $($os.Caption) $($os.Version) ($($os.OSArchitecture))" | Tee-Object runner-info.txt
      - name: Run all cases
        run: |
          set -o pipefail
          WORK="$(cygpath -m "$RUNNER_TEMP")/w"   # mixed form D:/a/_temp/w: valid for bash, the exe and Windows python
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          ATB="$PWD/atb-win64.exe" WORK="$WORK" bash verify/run_all.sh 2>&1 | tee run_all.txt
      - name: Compare against reference outputs
        run: |
          set -o pipefail; export WORK
          python verify/cmp.py  2>&1 | tee cmp.txt
          python verify/grow.py 2>&1 | tee grow.txt
          python verify/report.py --label "x86-64, SSE math, static (comparison build); $(head -1 runner-info.txt)" 2>&1 | tee table.md
          mkdir -p report && cp table.md cmp.txt grow.txt run_all.txt runner-info.txt binary-check.txt toolchain.txt report/
          cp "$WORK/report.json" report/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report-win64
          path: report/
